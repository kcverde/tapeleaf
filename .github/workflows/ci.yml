name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Verify root & subpath builds
        run: |
          npm run build
          VITE_BASE_PATH=/tapeleaf/ npm run build
